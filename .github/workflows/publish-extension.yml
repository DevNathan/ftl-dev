# Publish the VSIX to Open VSX and/or Visual Studio Marketplace.
#
# Secrets (Settings → Secrets and variables → Actions):
#   OVSX_PAT   — Open VSX access token (https://open-vsx.org/user-settings/tokens)
#   VSCE_PAT   — Azure DevOps PAT with Marketplace (Publish) scope
#                https://code.visualstudio.com/api/working-with-extensions/publishing-extension
#
# Trigger: push of a version tag only (vX.Y.Z). Never on branch push.
# Bump extension/package.json "version" + CHANGELOG before tagging; tag must match.

name: Publish Extension

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Verify tag matches package.json version
        working-directory: .
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(node -p "require('./extension/package.json').version")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match package.json version (expected $EXPECTED)."
            exit 1
          fi
          echo "Tag $TAG matches package.json."

      - name: Install & test
        run: |
          npm ci
          npm test

      - name: Package VSIX
        run: npm run package

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "Secret OVSX_PAT is not set — skipping Open VSX publish."
            exit 0
          fi
          VSIX=$(ls -1 ftl-dev-*.vsix | head -1)
          echo "Publishing $VSIX to Open VSX…"
          npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "Secret VSCE_PAT is not set — skipping Marketplace publish."
            exit 0
          fi
          VSIX=$(ls -1 ftl-dev-*.vsix | head -1)
          echo "Publishing $VSIX to Visual Studio Marketplace…"
          npx --yes @vscode/vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftl-dev-vsix
          path: extension/ftl-dev-*.vsix
