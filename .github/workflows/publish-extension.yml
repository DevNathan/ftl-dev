# Release the CodeOSS-compatible VSIX to GitHub Releases and Open VSX.
# Set the OVSX_PAT Actions secret to enable Open VSX publishing.
# Tag vX.Y.Z must match extension/package.json version X.Y.Z.

name: Publish Extension

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-vsix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Verify tag matches package.json version
        working-directory: .
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(node -p "require('./extension/package.json').version")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match package.json version (expected $EXPECTED)."
            exit 1
          fi
          echo "Tag $TAG matches package.json."

      - name: Install & test
        run: |
          npm ci
          npm test

      - name: Package VSIX
        id: package
        run: |
          VSIX="ftl-dev-${GITHUB_REF_NAME#v}.vsix"
          npm run package -- --out "$VSIX"
          test -f "$VSIX"
          echo "file=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Attach VSIX to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_FILE: ${{ steps.package.outputs.file }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "extension/$VSIX_FILE" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftl-dev-vsix-${{ github.ref_name }}-run-${{ github.run_attempt }}
          path: extension/${{ steps.package.outputs.file }}

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_FILE: ${{ steps.package.outputs.file }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT is not configured. Open VSX publishing was skipped."
            exit 0
          fi
          npx --yes ovsx@1.4.0 publish "$VSIX_FILE" --skip-duplicate
