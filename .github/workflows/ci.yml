name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            server/package-lock.json
      - run: npm ci
      - name: Forbidden-terms guard (list from secret; skipped when absent)
        env:
          FTL_DEV_FORBIDDEN_TERMS: ${{ secrets.FTL_DEV_FORBIDDEN_TERMS }}
        run: npm run check:terms
      - run: npm test
      - name: Language server type-check
        working-directory: server
        run: |
          npm ci
          npx tsc -p . --noEmit
